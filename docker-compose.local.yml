version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  codingsoft-webui:
    image: ghcr.io/codingsoft/webui:main
    container_name: codingsoft-webui
    volumes:
      - codingsoft-webui-data:/app/backend/data
      # Montar el build local del frontend
      - ./build:/app/build:ro
      - ./backend/open_webui:/app/backend/open_webui:ro
      - ./package.json:/app/package.json:ro
    ports:
      - "3000:8080"
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-tu-clave-secreta-32-chars-min}
      - OLLAMA_BASE_URL=http://ollama:11434
      - VERSION=0.8.10
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama:
  codingsoft-webui-data:
