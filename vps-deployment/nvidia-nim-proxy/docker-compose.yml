version: '3.8'

services:
  nvidia-nim-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nvidia-nim-proxy
    restart: unless-stopped
    ports:
      - '127.0.0.1:8099:8000'
    environment:
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - ALLOWED_ORIGINS=*
    networks:
      - webui-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  webui-net:
    external: true
