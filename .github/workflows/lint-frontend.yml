name: Lint Frontend

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  lint:
    name: 'Lint Frontend'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --force

      - name: Run ESLint
        run: npm run lint:frontend

      - name: Run TypeScript Check
        run: npm run check

      - name: Run Prettier Check
        run: npx prettier --check "**/*.{js,ts,svelte,css,md,html,json}"
