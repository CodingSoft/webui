name: Sync with Upstream

on:
  schedule:
    # Todos los domingos a las 2:00 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to sync (default: main)'
        required: false
        default: 'main'
        type: string

env:
  UPSTREAM_REPO: open-webui/open-webui

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || true
          git fetch upstream

      - name: Check for changes
        id: check
        run: |
          git fetch origin main
          git fetch upstream main
          
          LOCAL_COMMIT=$(git rev-parse origin/main)
          UPSTREAM_COMMIT=$(git rev-parse upstream/main)
          
          if [ "$LOCAL_COMMIT" = "$UPSTREAM_COMMIT" ]; then
            echo "No hay cambios nuevos en upstream"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Hay cambios nuevos en upstream"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            
            # Obtener versión de upstream
            UPSTREAM_VERSION=$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo "desconocida")
            echo "upstream_version=$UPSTREAM_VERSION" >> $GITHUB_OUTPUT
            
            # Contar commits nuevos
            NEW_COMMITS=$(git rev-list --count origin/main..upstream/main)
            echo "new_commits=$NEW_COMMITS" >> $GITHUB_OUTPUT
          fi

      - name: Sync main branch
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git checkout main
          git merge upstream/main --no-edit
          git push origin main

      - name: Create sync PR for codingsoft/custom
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git checkout codingsoft/custom
          git checkout -b sync/upstream-${{ steps.check.outputs.upstream_version }}-$(date +%Y%m%d)
          
          # Merge de main a la rama de sync
          git merge main --no-edit || true
          
          # Verificar si hay conflictos
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "⚠️ Hay conflictos que resolver manualmente"
            echo "has_conflicts=true" >> $GITHUB_ENV
          else
            echo "has_conflicts=false" >> $GITHUB_ENV
          fi
          
          # Push de la rama
          git push origin sync/upstream-${{ steps.check.outputs.upstream_version }}-$(date +%Y%m%d)
          
          # Crear PR
          if [ "$has_conflicts" = "true" ]; then
            gh pr create \
              --base codingsoft/custom \
              --head sync/upstream-${{ steps.check.outputs.upstream_version }}-$(date +%Y%m%d) \
              --title "🔄 Sync: Actualizar desde upstream ${{ steps.check.outputs.upstream_version }}" \
              --body "## 🔄 Sincronización con Upstream

          **Versión upstream:** ${{ steps.check.outputs.upstream_version }}
          **Commits nuevos:** ${{ steps.check.outputs.new_commits }}
          **Fecha:** $(date +%Y-%m-%d)

          ⚠️ **ATENCIÓN:** Hay conflictos que deben resolverse manualmente.

          ### Pasos para resolver:
          1. Checkout de esta rama
          2. Resolver conflictos
          3. Commit de los cambios
          4. Push

          ### Archivos en conflicto:
          \`\`\`
          $(git diff --name-only --diff-filter=U)
          \`\`\`" \
              --label "sync" \
              --label "conflict"
          else
            gh pr create \
              --base codingsoft/custom \
              --head sync/upstream-${{ steps.check.outputs.upstream_version }}-$(date +%Y%m%d) \
              --title "🔄 Sync: Actualizar desde upstream ${{ steps.check.outputs.upstream_version }}" \
              --body "## 🔄 Sincronización con Upstream

          **Versión upstream:** ${{ steps.check.outputs.upstream_version }}
          **Commits nuevos:** ${{ steps.check.outputs.new_commits }}
          **Fecha:** $(date +%Y-%m-%d)

          ✅ Esta sincronización se realizó sin conflictos.

          ### Cambios incluidos:
          Ver [CHANGELOG](https://github.com/${{ env.UPSTREAM_REPO }}/blob/main/CHANGELOG.md) del proyecto base." \
              --label "sync" \
              --label "automated"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          has_conflicts: ${{ env.has_conflicts }}

      - name: Notify success
        if: steps.check.outputs.has_changes == 'true'
        run: |
          echo "✅ Sincronización completada"
          echo "🔗 Ver PR en: https://github.com/${{ github.repository }}/pulls"

      - name: Skip notification
        if: steps.check.outputs.has_changes == 'false'
        run: |
          echo "⏭️ No hay cambios para sincronizar"
