name: Lint Backend

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  lint:
    name: 'Lint Backend with Pylint'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r backend/requirements.txt

      - name: Run Pylint
        run: |
          cd backend
          pylint open_webui/ --rcfile=.pylintrc || true

      - name: Run Black Check
        run: |
          pip install black
          black --check --diff backend/ || true
